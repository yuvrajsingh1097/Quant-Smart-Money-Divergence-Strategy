# Smart Money Divergence Strategy - CONSERVATIVE Configuration
# Low-risk parameters for steady, sustainable growth
# Best for: Traders prioritizing capital preservation, new traders testing strategy

RSI_PERIOD: 21              # Smoother RSI, fewer false divergences
RSI_OB: 70                  # Higher threshold, only extreme overbought
RSI_OS: 30                  # Lower threshold, only extreme oversold

SWING_LOOKBACK: 7           # Larger lookback, only major pivot points
BOS_LOOKBACK: 30            # Longer history, well-established structure

MIN_DIV_RSI_DELTA: 6.0      # Higher threshold, only STRONG divergences
MIN_BOS_PIPS: 8             # Larger BOS magnitude required

SCORE_THRESHOLD: 75         # High signal quality bar (only GOOD+ signals)

RISK_PCT: 0.005             # 0.5% per trade (half of default)
RR: 2.5                     # Wider profit targets

STARTING_EQUITY: 10000

SAVE_CHART: true
SAVE_SIGNALS: true
SAVE_EQUITY: true
SAVE_TRADES: true

# ============================================================================
# EXPECTED PERFORMANCE
# ============================================================================
# Win Rate: 55-65%
# Average Trade Duration: 50+ bars
# Trade Frequency: 2-3 per week
# Max Drawdown: 10-15%
# Monthly Return: 1-2%
# Annual Return: 12-24%
#
# ADVANTAGES:
# ✓ Minimal drawdown (easier psychological management)
# ✓ Low win rate requirement (55%+ is sustainable)
# ✓ High signal quality (fewer whipsaws)
# ✓ Best for account size $5,000-$25,000
#
# DISADVANTAGES:
# ✗ Fewer trading opportunities (~2-3/week)
# ✗ Slower equity curve growth
# ✗ May miss some profitable setups
# ============================================================================
